name: APKForge CI v1.0 – Build, Test & Artifact Upload

on:
  workflow_dispatch:
  
  workflow_call:
    inputs:
      name:
        description: "Android Project/Repo"
        required: false
        type: string
        default: "Android App"
      build-type:
         description: |
          Build Variant (debug/release)
           => Release = signed, optimized, ready for Play Store.
           => Debug = unsigned, faster, for testing.
         required: true
         type: string
         default: 'Debug'
      java-version:
        description: "JDK version"
        type: string
        required: false
        default: "17"
      api-level:
        description: "Android Version"
        type: number
        required: false
        default: 34 # Android 14, Upside Down Cake
      ndk:
        description: "NDK Version"
        required: false
        type: string
        default: ''
      cmake:
        description: "CMake Version"
        required: false
        type: string
        default: ''
    secrets:
      ANDROID_KEYSTORE:
        description: "Base64 Android Keystore"
        required: false
      ANDROID_KEY_PASSWORD:
        description: "Android keystore Password"
        required: false
      ANDROID_KEY_ALIAS:
        description: "Android Keystore Alias"
        required: false

env:
  PROJECT_NAME: ${{ inputs.name }}
  BUILD_TYPE: ${{ inputs.build-type }}
  JAVA_VERSION: ${{ inputs.java-version }}
  ANDROID_API_LEVEL: ${{ inputs.api-level }}
  NDK_VERSION: ${{ inputs.ndk }}
  CMAKE_VERSION: ${{ inputs.cmake }}
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.configuration-cache=true"
  CI: "true"

  # Optional signing envs (populate via secrets)
  ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

defaults:
  run:
    shell: bash
    working-directory: .

#concurrency:
  #group: ${{ github.workflow }}-${{ github.ref }}
  #cancel-in-progress: true

permissions:
  contents: read
  #actions: read

jobs:
  APKForge:
    name: Forge ${{ inputs.name }}
    runs-on: ubuntu-latest
    
    #concurrency:
      #group: ${{ github.workflow }}-${{ github.ref }}
      #cancel-in-progress: true
    
    env:
      CI: true
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.configuration-cache=true"
    
    steps:
      - name: Validate Build Type
        run: |
          BUILD_TYPE=$BUILD_TYPE
          BUILD_TYPE_LOWER=$(echo $BUILD_TYPE | tr '[:upper:]' '[:lower:]')
           case $BUILD_TYPE_LOWER in debug|release)
            echo "Build type valid($BUILD_TYPE) ✅ "
            ;;
          *)
            echo "Invalid build type: $BUILD_TYPE"
            exit 1
            ;;
          esac
        #BUILD_TYPE="${{ inputs.build-type | downcase }}"
        
      # Checkout the Current Repo
      - name: Checkout ${{ inputs.name }} Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
        
      # Set up JDK
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          architecture: x64
          java-package: jdk
        
      # Cache Gradle dependencies
      - name: 📦 Cache Gradle Packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
          key: gradle-cache-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles(
              '**/*.gradle',
              '**/*.gradle.kts',
              '**/settings.gradle',
              '**/settings.gradle.kts',
              '**/gradle.properties',
              '**/gradle-wrapper.properties',
              '**/libs.versions.toml'
            ) }}
          restore-keys: |
            gradle-cache-${{ runner.os }}-${{ github.ref_name }}-
            gradle-cache-${{ runner.os }}-main-
        
      # Set up Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ inputs.api-level }}
          build-tools: "34.0.0"
          ndk: ${{ inputs.ndk }}
          cmake: ${{ inputs.cmake }}
          accept-licenses: true
        
      # Assign Permissions
      - name: Assign Permissions
        run: |
          chmod +x ./gradlew
          
        
      - name: Log Environment
        run: |
          java -version
          ./gradlew --version
          echo "API Level: $ANDROID_API_LEVEL"
          echo "Build Type: $BUILD_TYPE"
        
      # Perform Unit and Lint Test
      - name: Lint Test 🧪
        run: |
          ./gradlew test lint --continue --stacktrace
        
      # 5️⃣ Run Gradle build
      - name: Build APK
        run: |
          set -e
          set -o pipefail
          echo "Building project: $PROJECT_NAME with build type $BUILD_TYPE"
          #./gradlew clean assemble$BUILD_TYPE
          ./gradlew clean assemble$BUILD_TYPE --stacktrace
        
      # 6️⃣ Upload APK artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }}-${{ inputs.build-type }}-apk
          path: |
            "**/build/outputs/apk/${{ inputs.build-type }}/*.apk"
          retention-days: 365



